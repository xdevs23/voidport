# A child started from the descriptor table of a process inherits a copy of
# each file of the process until `execve` in the child ends. Meanwhile a FUSE
# mount is busy and a `flock` lock is still taken. A crate links its
# `clippy.toml` to this file to start every child through voidport-spawn. The
# voidport-spawn crate does not link this file.

disallowed-types = [
    { path = "std::process::Command", reason = "start the child with voidport_spawn::Program, which runs it from a descriptor table that contains no file of the process" },
    { path = "tokio::process::Command", reason = "start the child with voidport_spawn::Program, which runs it from a descriptor table that contains no file of the process" },
]

disallowed-methods = [
    { path = "std::process::Command::spawn", reason = "start the child with voidport_spawn::Program::spawn" },
    { path = "std::process::Command::output", reason = "start the child with voidport_spawn::Program::output" },
    { path = "std::process::Command::status", reason = "start the child with voidport_spawn::Program::status" },
    { path = "tokio::process::Command::spawn", reason = "start the child with voidport_spawn::Program::spawn" },
    { path = "tokio::process::Command::output", reason = "start the child with voidport_spawn::Program::output" },
    { path = "tokio::process::Command::status", reason = "start the child with voidport_spawn::Program::status" },
]
