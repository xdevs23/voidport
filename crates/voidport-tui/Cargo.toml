[package]
name = "voidport-tui"
description = "voidport operator TUI: a full-screen manager for a running voidportd, over its control protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
autotests = false

[dependencies]
voidport-control = { workspace = true, features = ["client"] }

crossterm = { workspace = true }
ratatui = { workspace = true }
rustix = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# The shared pty harness the terminal-lifecycle proofs run their child in.
voidport-pty = { workspace = true }
# Scratch space of the unit tests.
voidport-test-host = { workspace = true }
voidport-test-support = { workspace = true }

[[test]]
name = "integration"
path = "tests/integration/main.rs"

# The terminal suite starts a child process on a pty for every case. A child
# has a copy of every descriptor of the test process until it starts the
# program it was created for. The control suite starts a server on the state
# file of a server it stopped, and a copy of the descriptor of the state lock
# in such a child makes that start fail. So the terminal suite is a test binary
# of its own.
[[test]]
name = "terminal"
path = "tests/terminal.rs"

[lints]
workspace = true
